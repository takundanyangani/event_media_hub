<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Event Media Hub{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand">
            <span class="brand-icon">◈</span>
            <span>EventHub</span>
        </a>
        <div class="nav-links">
            {% if session.get('username') %}
                <span class="nav-user">{{ session['username'] }}</span>
                <a href="/dashboard" class="nav-link">Dashboard</a>
                <a href="/logout" class="nav-link nav-logout">Logout</a>
            {% else %}
                <a href="/login" class="nav-link">Login</a>
                <a href="/signup" class="nav-link btn-primary-sm">Sign Up</a>
            {% endif %}
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Event Media Hub &mdash; Share your moments</p>
    </footer>
</body>
</html>
