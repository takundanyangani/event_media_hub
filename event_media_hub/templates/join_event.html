{% extends "base.html" %}
{% block title %}Join Event — EventHub{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">🔗</div>
            <h1>Join an Event</h1>
            <p>Enter the 6-character code shared by the event organiser</p>
        </div>

        {% if error %}
            <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/join_event" class="auth-form">
            <div class="form-group">
                <label for="code">Event Code</label>
                <input id="code" type="text" name="code"
                       placeholder="e.g. AB12CD"
                       maxlength="6"
                       style="text-transform: uppercase; letter-spacing: 0.2em; font-size: 1.3rem; text-align: center;"
                       required autofocus>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Join Event</button>
        </form>

        <p class="auth-footer">
            <a href="/dashboard">← Back to Dashboard</a>
        </p>
    </div>
</div>
{% endblock %}
